name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: npm run score
      - name: Test readiness Action
        uses: ./
        with:
          card: examples/coding-agent.card.json
          min-score: "15"
      - name: Test published v0 Action
        uses: lindixu6-hash/awesome-agentic-engineering@v0
        with:
          card: examples/support-agent.card.json
          min-score: "0"
