name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate community YAML
        run: |
          ruby -e '
            require "yaml"
            Dir[".github/ISSUE_TEMPLATE/*.{yml,yaml}"].sort.each do |path|
              YAML.safe_load(File.read(path), aliases: true)
              puts "Parsed #{path}"
            end
          '
      - run: npm run install:langgraph
      - run: npm test
      - run: npm run validate:fixtures
      - run: npm run validate:results
      - name: Generate fail-closed starter
        run: |
          mkdir .tmp-init
          cd .tmp-init
          node "$GITHUB_WORKSPACE/bin/agentic-init.js" \
            --profile draft-only \
            --name "CI Starter Agent"
          test -f agent-card.json
          test -f .github/workflows/agent-readiness.yml
      - name: Test generated starter gate
        id: starter-gate
        continue-on-error: true
        uses: ./
        with:
          card: .tmp-init/agent-card.json
          profile: "draft-only"
          fail-on-blockers: "true"
      - name: Verify generated starter fails closed
        env:
          STEP_OUTCOME: ${{ steps.starter-gate.outcome }}
          SCORE: ${{ steps.starter-gate.outputs.score }}
          PROFILE_PASSED: ${{ steps.starter-gate.outputs.profile-passed }}
          BLOCKER_COUNT: ${{ steps.starter-gate.outputs.blocker-count }}
        run: |
          test "$STEP_OUTCOME" = "failure"
          test "$SCORE" = "0"
          test "$PROFILE_PASSED" = "false"
          test "$BLOCKER_COUNT" = "1"
      - name: Test published v0 initializer
        run: |
          starter_dir="$(mktemp -d)"
          cd "$starter_dir"
          npm exec --yes \
            --package=github:lindixu6-hash/awesome-agentic-engineering#v0 \
            -- agentic-init \
            --profile read-only \
            --name "Published v0 Starter"
          test -f agent-card.json
          test -f .github/workflows/agent-readiness.yml
          node -e '
            const card = require("./agent-card.json");
            if (card.name !== "Published v0 Starter") process.exit(1);
            if (card.risk_profile !== "read-only") process.exit(1);
            if (Object.values(card.scorecard).some((score) => score !== 0)) {
              process.exit(1);
            }
            if (card.launch_blockers.length !== 1) process.exit(1);
          '
          grep -q 'uses: lindixu6-hash/awesome-agentic-engineering@v0' \
            .github/workflows/agent-readiness.yml
      - name: Run deterministic reference Agent eval
        env:
          SOURCE_DATE_EPOCH: "1786924800"
        run: npm run eval:reference
      - name: Validate generated eval results with published v0
        run: |
          npm exec --yes \
            --package=github:lindixu6-hash/awesome-agentic-engineering#v0 \
            -- agentic-validate-results artifacts/reference-eval/results.jsonl \
            --fixtures evals/prompt-injection/fixtures.jsonl
      - name: Upload reference eval evidence
        uses: actions/upload-artifact@v7
        with:
          name: reference-eval-evidence
          path: artifacts/reference-eval
      - name: Run LangGraph Agent eval
        env:
          SOURCE_DATE_EPOCH: "1786924800"
        run: npm run eval:langgraph
      - name: Validate LangGraph results with published v0
        run: |
          npm exec --yes \
            --package=github:lindixu6-hash/awesome-agentic-engineering#v0 \
            -- agentic-validate-results artifacts/langgraph-eval/results.jsonl \
            --fixtures evals/prompt-injection/fixtures.jsonl
      - name: Upload LangGraph eval evidence
        uses: actions/upload-artifact@v7
        with:
          name: langgraph-eval-evidence
          path: artifacts/langgraph-eval
      - name: Test published v0 fixture validator
        run: |
          npm exec --yes \
            --package=github:lindixu6-hash/awesome-agentic-engineering#v0 \
            -- agentic-validate-fixtures evals/prompt-injection/fixtures.jsonl
      - name: Test published v0 eval result validator
        run: |
          npm exec --yes \
            --package=github:lindixu6-hash/awesome-agentic-engineering#v0 \
            -- agentic-validate-results examples/eval-results/pass.json \
            --fixtures evals/prompt-injection/fixtures.jsonl
      - run: npm run score
      - run: npm run score:operations
      - name: Test read-only risk profile
        uses: ./
        with:
          card: examples/read-only-agent.card.json
          profile: "read-only"
      - name: Test readiness Action
        uses: ./
        with:
          card: examples/coding-agent.card.json
          min-score: "15"

      - name: Test strict launch-blocker gate
        id: strict-blockers
        continue-on-error: true
        uses: ./
        with:
          card: examples/coding-agent.card.json
          min-score: "15"
          fail-on-blockers: "true"

      - name: Verify strict launch-blocker result
        env:
          STEP_OUTCOME: ${{ steps.strict-blockers.outcome }}
          PASSED: ${{ steps.strict-blockers.outputs.passed }}
          BLOCKER_COUNT: ${{ steps.strict-blockers.outputs.blocker-count }}
        run: |
          test "$STEP_OUTCOME" = "failure"
          test "$PASSED" = "false"
          test "$BLOCKER_COUNT" = "2"

      - name: Test published v0 Action
        id: published-v0
        uses: lindixu6-hash/awesome-agentic-engineering@v0
        with:
          card: examples/support-agent.card.json
          min-score: "0"

      - name: Test published v0 risk profile
        id: published-v0-profile
        uses: lindixu6-hash/awesome-agentic-engineering@v0
        with:
          card: examples/read-only-agent.card.json
          profile: "read-only"

      - name: Test published v0 strict blocker gate
        id: published-v0-strict
        continue-on-error: true
        uses: lindixu6-hash/awesome-agentic-engineering@v0
        with:
          card: examples/coding-agent.card.json
          min-score: "15"
          fail-on-blockers: "true"

      - name: Verify published v0 outputs
        env:
          COMPAT_PASSED: ${{ steps.published-v0.outputs.passed }}
          PROFILE_NAME: ${{ steps.published-v0-profile.outputs.profile }}
          PROFILE_PASSED: ${{ steps.published-v0-profile.outputs.profile-passed }}
          STRICT_OUTCOME: ${{ steps.published-v0-strict.outcome }}
          STRICT_PASSED: ${{ steps.published-v0-strict.outputs.passed }}
          STRICT_BLOCKER_COUNT: ${{ steps.published-v0-strict.outputs.blocker-count }}
        run: |
          test "$COMPAT_PASSED" = "true"
          test "$PROFILE_NAME" = "read-only"
          test "$PROFILE_PASSED" = "true"
          test "$STRICT_OUTCOME" = "failure"
          test "$STRICT_PASSED" = "false"
          test "$STRICT_BLOCKER_COUNT" = "2"
