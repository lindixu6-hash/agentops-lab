name: Deploy Scorecard

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "starters/**"
      - "assets/scorecard.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build static site
        run: |
          mkdir -p _site/assets
          cp -R web/. _site/
          cp -R starters _site/starters
          cp assets/scorecard.svg assets/social-preview.png _site/assets/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
