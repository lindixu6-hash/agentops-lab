name: Agent Production Readiness Gate
description: Score an Agent Card in CI and optionally fail below a readiness threshold.
author: lindixu6-hash

branding:
  icon: check-circle
  color: green

inputs:
  card:
    description: Path to an Agent Card JSON file.
    required: false
    default: agent-card.json
  profile:
    description: Optional built-in risk profile (read-only, draft-only, or state-changing).
    required: false
    default: ""
  min-score:
    description: Minimum accepted score from 0 to 20.
    required: false
    default: "15"
  fail-below:
    description: Fail the workflow when the score is below min-score.
    required: false
    default: "true"
  fail-on-blockers:
    description: Fail the workflow when launch_blockers is not empty.
    required: false
    default: "false"

outputs:
  score:
    description: Numeric production-readiness score.
  rating:
    description: Readiness rating.
  badge:
    description: Markdown for a README-ready score badge.
  passed:
    description: Whether the combined score and launch-blocker gates passed.
  profile:
    description: Selected risk profile, or an empty string.
  profile-passed:
    description: Whether all selected risk-profile requirements passed.
  blocker-count:
    description: Number of declared launch blockers.
  blockers:
    description: JSON array of declared launch blockers.

runs:
  using: node24
  main: action/index.js
