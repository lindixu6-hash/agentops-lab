name: Agent Production Readiness Gate
description: Score an Agent Card in CI and optionally fail below a readiness threshold.
author: lindixu6-hash

branding:
  icon: check-circle
  color: green

inputs:
  card:
    description: Path to an Agent Card JSON file.
    required: false
    default: agent-card.json
  min-score:
    description: Minimum accepted score from 0 to 20.
    required: false
    default: "15"
  fail-below:
    description: Fail the workflow when the score is below min-score.
    required: false
    default: "true"

outputs:
  score:
    description: Numeric production-readiness score.
  rating:
    description: Readiness rating.
  badge:
    description: Markdown for a README-ready score badge.

runs:
  using: node24
  main: action/index.js
